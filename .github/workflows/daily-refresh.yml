name: daily jobs refresh

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-jobs-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run jobs:fetch
      - run: bun run typecheck
      - run: bun run build:offline
      - name: commit fresh jobs data
        run: |
          if git status --porcelain public/data/jobs.json | grep -q .; then
            git config user.name "jobs-bot"
            git config user.email "jobs-bot@users.noreply.github.com"
            git add public/data/jobs.json
            git commit -m "chore: refresh jobs data"
            git push
          else
            echo "No job changes."
          fi
